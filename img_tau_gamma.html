<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: #021223; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  draw(canvas.width, canvas.height);
}

function arrowHead(ctx, x2, y2, angle, headLen, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - 0.38), y2 - headLen * Math.sin(angle - 0.38));
  ctx.lineTo(x2 - headLen * Math.cos(angle + 0.38), y2 - headLen * Math.sin(angle + 0.38));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawCurve(ctx, pts, color, lw) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 2; i++) {
    const mx = (pts[i][0] + pts[i+1][0]) / 2;
    const my = (pts[i][1] + pts[i+1][1]) / 2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  ctx.quadraticCurveTo(pts[pts.length-2][0], pts[pts.length-2][1], pts[pts.length-1][0], pts[pts.length-1][1]);
  ctx.stroke();
  ctx.restore();
}

function draw(W, H) {
  ctx.clearRect(0, 0, W, H);
  const fontSize = Math.max(12, W * 0.032);
  ctx.font = `${fontSize}px 'Segoe UI', sans-serif`;

  const ox = W * 0.12;   // origin x
  const oy = H * 0.85;   // origin y
  const axW = W * 0.72;  // axis width
  const axH = H * 0.75;  // axis height
  const lw = Math.max(2, W * 0.004);

  // ── EJES ──
  ctx.strokeStyle = '#ecf0f1';
  ctx.lineWidth = 2;
  // X axis
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + axW + 20, oy); ctx.stroke();
  arrowHead(ctx, ox + axW + 20, oy, 0, 10, '#ecf0f1');
  // Y axis
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, oy - axH - 20); ctx.stroke();
  arrowHead(ctx, ox, oy - axH - 20, -Math.PI/2, 10, '#ecf0f1');

  // axis labels
  ctx.fillStyle = '#ecf0f1';
  ctx.font = `italic ${fontSize * 1.1}px 'Segoe UI', sans-serif`;
  ctx.fillText('τ [Pa]', ox + 8, oy - axH - 10);
  ctx.font = `italic ${fontSize}px 'Segoe UI', sans-serif`;
  ctx.fillText('γ̇ = du/dy [s⁻¹]', ox + axW - fontSize * 2, oy + fontSize * 1.5);

  // τ₀ dot and label (orange)
  const tau0x = ox;
  const tau0y = oy - axH * 0.34;
  ctx.fillStyle = '#f97316';
  ctx.beginPath();
  ctx.arc(tau0x, tau0y, fontSize * 0.45, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f97316';
  ctx.font = `italic ${fontSize}px 'Segoe UI', sans-serif`;
  ctx.fillText('τ₀', ox - fontSize * 2.0, tau0y + fontSize * 0.4);

  // endpoint for all curves (same top-right point)
  const endX = ox + axW * 0.78;
  const endY = oy - axH * 0.75;

  // ── 1. PSEUDOPLÁSTICO (rojo — cóncavo desde origen, llega MÁS ALTO) ──
  // starts at origin, curves upward fast then levels toward end
  const pseudoY = endY - axH * 0.07;
  const pseudoPts = [
    [ox, oy],
    [ox + axW * 0.10, oy - axH * 0.30],
    [ox + axW * 0.25, oy - axH * 0.52],
    [ox + axW * 0.45, oy - axH * 0.63],
    [ox + axW * 0.60, oy - axH * 0.70],
    [endX, pseudoY]
  ];
  drawCurve(ctx, pseudoPts, '#dc2626', lw * 1.4);
  ctx.fillStyle = '#dc2626';
  ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
  ctx.fillText('Pseudoplástico', endX + 8, pseudoY + fontSize * 0.01);

  // ── 2. NEWTONIANO (azul — línea recta desde origen) ──
  const newtonianEndY = endY + axH * 0.03;
  ctx.save();
  ctx.strokeStyle = '#2563eb';
  ctx.lineWidth = lw * 1.4;
  ctx.beginPath();
  ctx.moveTo(ox, oy);
  ctx.lineTo(endX, newtonianEndY);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#2563eb';
  ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
  ctx.fillText('Newtoniano', endX + 9, newtonianEndY + fontSize * 0.1);

  // ── 3. BINGHAM (naranja — línea recta desde τ₀) ──
  ctx.save();
  ctx.strokeStyle = '#f97316';
  ctx.lineWidth = lw * 1.4;
  ctx.beginPath();
  ctx.moveTo(tau0x, tau0y);
  ctx.lineTo(endX, endY + axH * 0.07);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#f97316';
  ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
  ctx.fillText('Bingham', endX + 8, endY + axH * 0.07 + fontSize * 0.4);

  // ── 4. DILATANTE (verde — convexo, llega MÁS BAJO) ──
  const dilatEndY = endY + axH * 0.20;
  const dilatPts = [
    [ox, oy],
    [ox + axW * 0.18, oy - axH * 0.05],
    [ox + axW * 0.35, oy - axH * 0.15],
    [ox + axW * 0.52, oy - axH * 0.30],
    [ox + axW * 0.65, oy - axH * 0.45],
    [endX, dilatEndY]
  ];
  drawCurve(ctx, dilatPts, '#16a34a', lw * 1.4);
  ctx.fillStyle = '#16a34a';
  ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
  ctx.fillText('Dilatante', endX + 8, dilatEndY + fontSize * 0.4);
}

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
