<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: #021223; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  draw(W, H);
}

function arrow(ctx, x1, y1, x2, y2, color, lineWidth=2, headLen=10) {
  const dx = x2 - x1, dy = y2 - y1;
  const angle = Math.atan2(dy, dx);
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - 0.4), y2 - headLen * Math.sin(angle - 0.4));
  ctx.lineTo(x2 - headLen * Math.cos(angle + 0.4), y2 - headLen * Math.sin(angle + 0.4));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function draw(W, H) {
  ctx.clearRect(0, 0, W, H);

  // Layout
  const leftPad  = W * 0.08;
  const rightPad = W * 0.05;
  const topPlate = H * 0.18;
  const botPlate = H * 0.78;
  const plateThick = H * 0.065;
  const fluidL = leftPad + W * 0.06;
  const fluidR = W * 0.60;
  const profileX = W * 0.65;
  const fontSize = Math.max(11, W * 0.022);
  ctx.font = `${fontSize}px 'Segoe UI', sans-serif`;

  // ── EJE Y ──
  arrow(ctx, leftPad, botPlate + plateThick * 0.5, leftPad, topPlate - H * 0.08, '#ecf0f1', 2, 9);
  ctx.fillStyle = '#ecf0f1';
  ctx.font = `italic ${fontSize * 1.1}px 'Segoe UI', sans-serif`;
  ctx.fillText('y', leftPad - 4, topPlate - H * 0.1);
  ctx.font = `${fontSize}px 'Segoe UI', sans-serif`;

  // ── 0 en el eje ──
  ctx.fillStyle = '#8fa3b4';
  ctx.fillText('0', leftPad - fontSize * 1.3, botPlate + plateThick + fontSize * 0.4);

  // ── h en el eje ──
  ctx.fillStyle = '#8fa3b4';
  ctx.fillText('h', leftPad - fontSize * 1.3, topPlate + fontSize * 0.4);

  // ── LÍNEAS PUNTEADAS h y 0 ──
  ctx.setLineDash([5, 5]);
  ctx.strokeStyle = '#8fa3b4';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(leftPad + 2, topPlate + plateThick);
  ctx.lineTo(fluidL, topPlate + plateThick);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(leftPad + 2, botPlate);
  ctx.lineTo(fluidL, botPlate);
  ctx.stroke();
  ctx.setLineDash([]);

  // ── PLACA FIJA (inferior) — gris con hachuras ──
  ctx.fillStyle = '#9ca3af';
  ctx.fillRect(fluidL, botPlate, fluidR - fluidL, plateThick);
  ctx.strokeStyle = '#6b7280';
  ctx.lineWidth = 1;
  for (let x = fluidL + 8; x < fluidR; x += 16) {
    ctx.beginPath();
    ctx.moveTo(x, botPlate + plateThick);
    ctx.lineTo(x - 10, botPlate + plateThick + 12);
    ctx.stroke();
  }
  // label placa fija
  ctx.fillStyle = '#ecf0f1';
  ctx.font = `${fontSize * 0.95}px 'Segoe UI', sans-serif`;
  ctx.fillText('placa fija', fluidR + fontSize * 0.5, botPlate + plateThick * 0.6);
  ctx.fillStyle = '#8fa3b4';
  ctx.font = `${fontSize * 0.85}px 'Segoe UI', sans-serif`;
  ctx.fillText('y = 0,  u = 0', fluidR + fontSize * 0.5, botPlate + plateThick * 0.6 + fontSize * 1.2);

  // ── FLUIDO (área azul claro) ──
  ctx.fillStyle = 'rgba(0,210,255,0.08)';
  ctx.fillRect(fluidL, topPlate + plateThick, fluidR - fluidL, botPlate - topPlate - plateThick);
  // texto fluido (μ)
  const midY = (topPlate + plateThick + botPlate) / 2;
  ctx.fillStyle = '#8fa3b4';
  ctx.font = `italic ${fontSize * 1.3}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('fluido (μ)', (fluidL + fluidR) / 2, midY + fontSize * 0.4);
  ctx.textAlign = 'left';
  ctx.font = `${fontSize}px 'Segoe UI', sans-serif`;

  // ── PLACA MÓVIL (superior) — gris con hachuras ──
  ctx.fillStyle = '#9ca3af';
  ctx.fillRect(fluidL, topPlate, fluidR - fluidL, plateThick);
  ctx.strokeStyle = '#6b7280';
  ctx.lineWidth = 1;
  for (let x = fluidL + 8; x < fluidR; x += 16) {
    ctx.beginPath();
    ctx.moveTo(x, topPlate);
    ctx.lineTo(x - 10, topPlate - 12);
    ctx.stroke();
  }
  // label placa móvil
  ctx.fillStyle = '#ecf0f1';
  ctx.font = `${fontSize * 0.95}px 'Segoe UI', sans-serif`;
  ctx.fillText('placa móvil', fluidR + fontSize * 0.5, topPlate + plateThick * 0.5);
  ctx.fillStyle = '#8fa3b4';
  ctx.font = `${fontSize * 0.85}px 'Segoe UI', sans-serif`;
  ctx.fillText('y = h,  u = U', fluidR + fontSize * 0.5, topPlate + plateThick * 0.5 + fontSize * 1.2);

  // ── FLECHA U (azul, sobre la placa superior) ──
  const uY = topPlate + plateThick * 0.5;
  const uX1 = fluidL + (fluidR - fluidL) * 0.15;
  const uX2 = fluidL + (fluidR - fluidL) * 0.45;
  arrow(ctx, uX1, uY, uX2, uY, '#3b82f6', 2.5, 10);
  ctx.fillStyle = '#3b82f6';
  ctx.font = `italic bold ${fontSize * 1.1}px 'Segoe UI', sans-serif`;
  ctx.fillText('U', uX1 - fontSize * 0.2, uY - fontSize * 0.7);

  // segunda flecha U
  const uX3 = fluidL + (fluidR - fluidL) * 0.55;
  const uX4 = fluidL + (fluidR - fluidL) * 0.85;
  arrow(ctx, uX3, uY, uX4, uY, '#3b82f6', 2.5, 10);

  // ── FLECHA F (verde, sobre la placa superior, a la derecha de U) ──
  const fY = topPlate - plateThick * 0.8;
  const fX1 = (fluidL + fluidR) / 2;
  const fX2 = fX1 + (fluidR - fluidL) * 0.35;
  arrow(ctx, fX1, fY, fX2, fY, '#22c55e', 2.5, 10);
  ctx.fillStyle = '#22c55e';
  ctx.font = `italic bold ${fontSize * 1.05}px 'Segoe UI', sans-serif`;
  ctx.fillText('F (fuerza aplicada)', fX2 + 6, fY + fontSize * 0.4);

  // ── COTAS h (naranja, doble flecha vertical) ──
  const hX = fluidL - W * 0.04;
  arrow(ctx, hX, topPlate + plateThick, hX, botPlate, '#f59e0b', 2, 9);
  arrow(ctx, hX, botPlate, hX, topPlate + plateThick, '#f59e0b', 2, 9);
  ctx.fillStyle = '#f59e0b';
  ctx.font = `italic bold ${fontSize * 1.15}px 'Segoe UI', sans-serif`;
  ctx.fillText('h', hX - fontSize * 1.0, midY + fontSize * 0.4);

  // ── PERFIL DE VELOCIDADES (lado derecho) ──
  const numVec = 6;
  const yBot = botPlate;
  const yTop = topPlate + plateThick;
  const totalH = yBot - yTop;
  const maxLen = W * 0.14;

  ctx.strokeStyle = '#b91c1c';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(profileX, yBot);
  ctx.lineTo(profileX + maxLen, yTop);
  ctx.stroke();

  for (let i = 0; i <= numVec; i++) {
    const t = i / numVec;
    const yy = yTop + t * totalH;
    const len = (1 - t) * maxLen;
    if (len > 2) {
      arrow(ctx, profileX, yy, profileX + len, yy, '#b91c1c', 2, 8);
    }
  }

  // etiqueta perfil
  ctx.fillStyle = '#b91c1c';
  ctx.font = `italic ${fontSize * 0.95}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(`u(y) = U · y/h`, profileX + maxLen * 0.5, yTop - fontSize * 1.5);
  ctx.fillStyle = '#b91c1c';
  ctx.font = `bold ${fontSize * 0.9}px 'Segoe UI', sans-serif`;
  ctx.fillText('Perfil de velocidades', profileX + maxLen * 0.5, H * 0.93);
  ctx.textAlign = 'left';
}

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
